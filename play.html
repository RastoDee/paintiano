  <style>
    #pf-boot{position:fixed;inset:0;z-index:2147483000;background:#06060c;cursor:pointer;overflow:hidden;transition:opacity .35s ease}
    #pf-boot.out{opacity:0;pointer-events:none}

    #pf-boot .t{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:600;letter-spacing:.04em;background:linear-gradient(95deg,#ffd96e,#f2eee8 50%,#f0c040);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;transform:translateY(10px) scale(.96);transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1);text-shadow:0 4px 30px rgba(0,0,0,.5)}

    <div id="pf-boot" role="button" aria-label="skip intro"><canvas></canvas><div class="c"><div class="t">Paintiano</div><div class="s">paintings, played</div></div><div class="k">tap to skip</div></div>
  <script>
  (function(){
    var el=document.getElementById('pf-boot'), cv=el.querySelector('canvas'), cbs=[], done=false, ended=false, ready=false, raf=0;
    // ended: the throw is over (or was tapped); ready: the app has mounted underneath. The overlay fades only when both hold,
    // so a slow connection shows the settled title instead of a black screen (a hard cap of 25 s in case the app never comes).
    var B=window.__pfBoot={ done:false, onDone:function(f){ if(B.done) f(); else cbs.push(f); }, ready:function(){ ready=true; el.querySelector('.k').style.opacity='0'; if(ended) fade(); }, finish:function(){ finish(); } };
    function fade(){ if(done) return; done=true; B.done=true; el.classList.add('out'); setTimeout(function(){ el.parentNode && el.parentNode.removeChild(el); },400); cbs.forEach(function(f){ try{ f(); }catch(e){} }); }
    function finish(){ if(ended) return; ended=true; cancelAnimationFrame(raf); el.classList.add('in'); if(ready) fade(); else el.querySelector('.k').style.opacity='0'; }
    setTimeout(function(){ ready=true; if(ended) fade(); else finish(); }, 25000);
    el.addEventListener('click', finish);
    try{
      var dpr=Math.min(2, window.devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
      var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
      var COF=[0,210,60,270,120,330,180,30,240,90,300,150];
      var hsl=function(h,s,l){ s/=100; l/=100; var k=function(n){ return (n+h/30)%12; }, a=s*Math.min(l,1-l), f=function(n){ return Math.round((l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))*255); }; return 'rgb('+f(0)+','+f(8)+','+f(4)+')'; };
      var strokes=[];
      var mk=function(t0){ var edge=Math.random(); var x=edge<.5 ? -20+Math.random()*40 : W-20+Math.random()*40; var y=H*(0.15+Math.random()*0.7); var dir=x<W/2?1:-1; var pc=(Math.random()*12)|0;
        strokes.push({t0:t0,x:x,y:y,vx:dir*(2.2+Math.random()*2.6),vy:(Math.random()-.5)*2.2,curl:(Math.random()-.5)*0.06,swing:Math.random()*6.28,w:2.5+Math.random()*4,col:hsl(COF[pc],80,50+Math.random()*16),life:0,max:42+Math.random()*40,px:x,py:y,drips:[]}); };
      var nextAt=4; for(var i=0;i<18;i++){ mk(nextAt); nextAt+=9+((Math.random()*12)|0); }
      var START=performance.now(), DUR=4600, frame=0, titled=false;
      var tick=function(now){ var elp=now-START; frame++;
        ctx.fillStyle='rgba(6,6,12,0.05)'; ctx.fillRect(0,0,W,H);
        for(var i=0;i<strokes.length;i++){ var s=strokes[i]; if(frame<s.t0) continue;
          if(s.life<=s.max){ s.life++; s.px=s.x; s.py=s.y; s.vx*=0.99; s.curl*=0.99; s.vy+=s.curl*6+Math.sin(s.life*0.18+s.swing)*0.12; s.x+=s.vx; s.y+=s.vy;
            var taper=Math.sin(Math.min(1,s.life/s.max)*Math.PI); ctx.strokeStyle=s.col; ctx.lineCap='round'; ctx.lineWidth=Math.max(0.6,s.w*taper); ctx.globalAlpha=0.9;
            ctx.beginPath(); ctx.moveTo(s.px,s.py); ctx.lineTo(s.x,s.y); ctx.stroke();
            if(Math.random()<0.18) s.drips.push({x:s.x,y:s.y,vx:s.vx*0.3+(Math.random()-.5),vy:s.vy*0.3+Math.random()*1.5,r:1+Math.random()*2.4,life:0,max:30+Math.random()*30,col:s.col}); }
          for(var j=0;j<s.drips.length;j++){ var d=s.drips[j]; if(d.life>d.max) continue; d.life++; d.vy+=0.12; d.x+=d.vx; d.y+=d.vy; ctx.globalAlpha=Math.max(0,1-d.life/d.max)*0.85; ctx.fillStyle=d.col; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.2832); ctx.fill(); } }
        ctx.globalAlpha=1;
        if(elp>1200 && !titled){ titled=true; el.classList.add('in'); }
        if(elp<DUR && !done) raf=requestAnimationFrame(tick); else finish(); };
      raf=requestAnimationFrame(tick);
      window.addEventListener('resize', function(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr); });
    }catch(e){ finish(); }
  })();
  </script>
