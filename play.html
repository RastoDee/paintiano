    #pf-boot.out{opacity:0;pointer-events:none}

    #pf-boot .s{color:#f0c040}   /* the head's own gold, under the gradient: the gradient fades off it on the way up — the word's light never dips */
    #pf-boot .g{background:linear-gradient(95deg,#ffd96e,#f6e7b8 50%,#f0c040);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    #pf-boot.in .w{opacity:1;transform:none}
    #pf-boot.go{pointer-events:none}
    #pf-boot.clr::before{opacity:0}
    #pf-boot.go .w{transition:opacity .42s ease .12s,transform .62s cubic-bezier(.45,0,.15,1)}
    #pf-boot.go .g{opacity:0}

  <script>
  (function(){
    var el=document.getElementById('pf-boot'), ws=el.querySelectorAll('.w'), root=document.documentElement, cbs=[], HOLD=800, FLY=620, shown=0, clr=0, tw=null, done=false, ready=false, going=false, skip=false;
    // The wordmark comes once its type is there, stands for a while (HOLD, counted from when it CAME — it was counted from the page's
    // start: on a quick phone the app was there before the type, and the word flashed and left), then rises to the word in the app's
    // head while the first screen comes up under it (the app is told as the word lifts off). A tap lets go at once.
    // ready: the app has mounted underneath. A hard cap of 25 s in case it never comes.
    var B=window.__pfBoot={ done:false, onDone:function(f){ if(B.done) f(); else cbs.push(f); },
      ready:function(){ if(ready) return; ready=true; plan(); },
      finish:function(){ skip=true; if(ready) fade(); } };
    function plan(){ if(!ready || done || going) return; if(skip){ go(); return; } if(!shown) return;   // not on the screen yet: show() plans again
      var w=HOLD-(Date.now()-shown); clearTimeout(tw); if(w>0) tw=setTimeout(go, w); else go(); }
    function tell(){ if(B.done) return; B.done=true; cbs.forEach(function(f){ try{ f(); }catch(e){} }); }
    function gone(){ el.parentNode && el.parentNode.removeChild(el); }
    function fade(){ if(done) return; done=true; root.classList.remove('pf-boot-fly'); el.classList.add('out'); setTimeout(gone, 300); tell(); }
    function box(n){ try{ var c=n.firstChild; while(c && c.nodeType!==3) c=c.nextSibling; if(c){ var g=document.createRange(); g.selectNodeContents(c); var q=g.getBoundingClientRect(); if(q.width>0 && q.height>0) return q; } }catch(e){} return n.getBoundingClientRect(); }
    function go(){ if(done || going) return; going=true;
      var reduce=false; try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
      var t=null; try{ t=document.querySelector('.pf-st-word'); }catch(e){}
      var r=t && box(t), a=box(ws[0]);
      if(skip || reduce || !r || !(r.width>0 && r.height>0) || !(a.width>0)){ fade(); return; }
      var k=(parseFloat(getComputedStyle(t).fontSize)||24)/(parseFloat(getComputedStyle(ws[0]).fontSize)||56);
      var dx=(r.left+r.width/2)-(a.left+a.width/2), dy=(r.top+r.height/2)-(a.top+a.height/2);
      root.classList.add('pf-boot-fly');
      try{ ws[0].style.textShadow='0 '+(2/k).toFixed(2)+'px '+(18/k).toFixed(2)+'px rgba(0,0,0,.6)'; }catch(e){}   // the head word's own shadow, at this one's size: nothing changes when they swap
      el.classList.add('in'); el.classList.add('go'); for(var i=0;i<ws.length;i++) ws[i].style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+k.toFixed(4)+')';
      // the app is told once the word is on its way (two frames on: its rise is the compositor's by then, the app's first work cannot hold
      // it back) — its first screen comes up under the rising word. Landed: when the rise has ended (or, at the latest, a while after)
      var raf=window.requestAnimationFrame ? function(f){ requestAnimationFrame(f); } : function(f){ setTimeout(f, 16); };
      raf(function(){ raf(tell); }); setTimeout(tell, 140);

      var t0=Date.now(); (function w(){ if(clr) return; var on=false; try{ on=!!document.querySelector('.pf-lh'); }catch(e){} if(on || Date.now()-t0>=FLY) clear(); else raf(w); })(); setTimeout(clear, FLY+60);
      ws[0].addEventListener('transitionend', function(e){ if(e.propertyName==='transform') land(); }); setTimeout(land, FLY+500); }
    function clear(){ if(clr) return; clr=Date.now(); el.classList.add('clr'); }

      clear(); var w=Math.max(60, 480-(Date.now()-clr));   // it goes once the dark has cleared: until then it lies on the head's word, the same

    var show=function(){ if(shown) return; shown=Date.now(); el.classList.add('in'); plan(); };

  })();
