      try{ ws[0].style.textShadow='0 '+(2/k).toFixed(2)+'px '+(18/k).toFixed(2)+'px rgba(0,0,0,.6)'; }catch(e){}   // the head word's own shadow, at this one's size: nothing changes when they swap
      el.classList.add('in'); el.classList.add('go'); for(var i=0;i<ws.length;i++) ws[i].style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+k.toFixed(4)+')';
      // the app is told once the word is on its way (two frames on: its rise is the compositor's by then, the app's first work cannot hold
      // it back) — its first screen comes up under the rising word. Landed: when the rise has ended (or, at the latest, a while after)
      var raf=window.requestAnimationFrame ? function(f){ requestAnimationFrame(f); } : function(f){ setTimeout(f, 16); };
      raf(function(){ raf(tell); }); setTimeout(tell, 140);
      // the dark clears once the app's first screen stands under it (what the app shows before that is not for the eye) — at the latest when the word lands
      var t0=Date.now(); (function w(){ if(clr) return; var on=false; try{ on=!!document.querySelector('.pf-lh'); }catch(e){} if(on || Date.now()-t0>=FLY) clear(); else raf(w); })(); setTimeout(clear, FLY+60);
      ws[0].addEventListener('transitionend', function(e){ if(e.propertyName==='transform') land(); }); setTimeout(land, FLY+500); }
    function clear(){ if(clr) return; clr=Date.now(); el.classList.add('clr'); }
    // landed: the head's own word (the same word in the same place) shows and this one goes, in ONE frame — never both (two words drawn over
    // each other read bold for those frames), never none. The overlay itself stays until its dark has cleared. If the head has moved
    // meanwhile (a tap went through to the app), this one fades off instead
    function land(){ if(done) return; done=true;
      var same=false; try{ var t=document.querySelector('.pf-st-word'), r=t && box(t), a=box(ws[0]); same=!!r && Math.abs((r.left+r.width/2)-(a.left+a.width/2))<1.5 && Math.abs((r.top+r.height/2)-(a.top+a.height/2))<1.5; }catch(e){}
      clear();
      if(same){ el.classList.add('landed'); root.classList.remove('pf-boot-fly'); setTimeout(gone, Math.max(60, 480-(Date.now()-clr))); }
      else{ root.classList.remove('pf-boot-fly'); el.classList.add('out'); setTimeout(gone, 300); } }
    setTimeout(function(){ ready=true; fade(); }, 25000);
    el.addEventListener('click', function(){ B.finish(); });
    // the dark colour scheme (the meta in the head) was for the time before the first paint only: once the page has painted it goes,
    // the app's own controls are styled for the light one
    var cs=document.getElementById('pf-cs'), csOff=function(){ if(!cs) return; try{ cs.setAttribute('content','light'); cs.parentNode && cs.parentNode.removeChild(cs); }catch(e){} cs=null; };
    if(window.requestAnimationFrame) requestAnimationFrame(function(){ requestAnimationFrame(csOff); }); setTimeout(csOff, 1200);
    // the wordmark shows once its type is there — it is in the page, so at once (or after .9 s, in whatever type there is): it never changes type on the screen
    var show=function(){ if(shown) return; shown=Date.now(); el.classList.add('in'); plan(); };
    // An iPhone opens a home-screen app in a frame that is the status bar short and makes it whole a frame or two after the first paint.
    // The word stands in the frame's middle: it came 31 pt too high and jumped down. So there it waits for the whole height (the
    // screen's) and for a moment at least (150 ms); if the height never gets there, until it has stood still for .3 s (the .9 s cap holds)
    var whole=function(f){ var st=false; try{ st=navigator.standalone===true; }catch(e){}
      if(!st || !window.requestAnimationFrame){ f(); return; }
      var t0=Date.now(), h=window.innerHeight, th=t0, full=0; try{ full=window.innerWidth>window.innerHeight ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height); }catch(e){}
      (function w(){ if(shown) return; var n=Date.now(), hh=window.innerHeight; if(hh!==h){ h=hh; th=n; }
        if(n-t0>=150 && ((full && hh>=full-2) || n-th>=300)){ f(); return; } requestAnimationFrame(w); })(); };
    try{ var tm=setTimeout(show, 900); document.fonts.load('600 56px "PfBoot"').then(function(){ whole(function(){ clearTimeout(tm); show(); }); }, function(){ clearTimeout(tm); show(); }); }catch(e){ show(); }
  })();
  </script>
