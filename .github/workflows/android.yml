# Builds the Android app (Capacitor shell around the web app).
#   • every push to the `android` branch: a debug APK (installable by hand, no secrets) as an artifact
#   • a commit marked [aab]: the signed release bundle for Google Play (.aab) as an artifact
#   • a commit marked [emu]: the APK is also started in an emulator and screenshots of it are kept as an artifact
name: Android

on:
  push:
    branches: [android]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: PF_NATIVE=android node scripts/ios-web.mjs
      - run: npx cap sync android
      - name: Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -la app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with: { name: paintiano-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Release bundle for Google Play
        if: ${{ contains(github.event.head_commit.message, '[aab]') }}
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PF_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$PF_KEYSTORE_PASSWORD" ]; then echo "the upload key is not in the secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD)"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PF_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release
          echo "versionCode $PF_VERSION_CODE"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -3
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ contains(github.event.head_commit.message, '[aab]') }}
        with: { name: paintiano-release-aab, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Enable KVM
        if: ${{ contains(github.event.head_commit.message, '[emu]') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start in an emulator and take screenshots
        if: ${{ contains(github.event.head_commit.message, '[emu]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.paintiano/.MainActivity
            mkdir -p shots
            sleep 25
            adb exec-out screencap -p > shots/1-start.png
            adb shell input tap 540 1100
            sleep 12
            adb exec-out screencap -p > shots/2-after-tap.png
            sleep 15
            adb exec-out screencap -p > shots/3-later.png
            adb logcat -d -s Capacitor:* Capacitor/Console:* chromium:* AndroidRuntime:E | tail -200 > shots/logcat.txt || true
      - name: Screenshots into the log
        if: ${{ always() && contains(github.event.head_commit.message, '[emu]') }}
        run: |
          ls -la shots || true
          python3 -m pip install -q pillow
          for f in 1-start 2-after-tap 3-later; do
            [ -f shots/$f.png ] || continue
            python3 -c "from PIL import Image; im=Image.open('shots/$f.png').convert('RGB'); im=im.resize((540, im.height*540//im.width)); im.save('shots/$f.jpg', quality=55)"
            echo "B64START $f"; base64 -w 20000 shots/$f.jpg; echo "B64END $f"
          done
          echo "LOGCAT"; tail -60 shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && contains(github.event.head_commit.message, '[emu]') }}
        with: { name: emulator-shots, path: shots }
