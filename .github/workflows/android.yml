# Builds the Android app (Capacitor shell around the web app).
#   • every push to the `android` branch: a debug APK (installable by hand, no secrets) as an artifact
#   • a commit marked [emu]: the APK is also started in an emulator and screenshots of it are kept as an artifact
name: Android

on:
  push:
    branches: [android]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: PF_NATIVE=android node scripts/ios-web.mjs
      - run: npx cap sync android
      - name: Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -la app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with: { name: paintiano-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Enable KVM
        if: ${{ contains(github.event.head_commit.message, '[emu]') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start in an emulator and take screenshots
        if: ${{ contains(github.event.head_commit.message, '[emu]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.paintiano/.MainActivity
            mkdir -p shots
            sleep 25
            adb exec-out screencap -p > shots/1-start.png
            adb shell input tap 540 1100
            sleep 12
            adb exec-out screencap -p > shots/2-after-tap.png
            sleep 15
            adb exec-out screencap -p > shots/3-later.png
            adb logcat -d -s Capacitor:* Capacitor/Console:* chromium:* AndroidRuntime:E | tail -200 > shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && contains(github.event.head_commit.message, '[emu]') }}
        with: { name: emulator-shots, path: shots }
