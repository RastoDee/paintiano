name: fetch-samples
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public-domain painting scans from Wikimedia Commons
        run: |
          mkdir -p drop
          UA="PaintianoSampleFetch/1.0 (https://paintiano.app; one-off fetch of public-domain scans)"
          get(){ out=$1; shift; for n in "$@"; do
              rm -f "drop/$out.jpg"
              curl -sSL --retry 3 -A "$UA" -o "drop/$out.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/$n?width=1920" || true
              if file "drop/$out.jpg" | grep -q "JPEG"; then echo "$out <- https://commons.wikimedia.org/wiki/File:$n" >> drop/sources.txt; return 0; fi
              sleep 2
            done; rm -f "drop/$out.jpg"; echo "FAIL $out" >> drop/sources.txt; }
          get renoir "Pierre-Auguste_Renoir,_Le_Moulin_de_la_Galette.jpg" "Auguste_Renoir_-_Dance_at_Le_Moulin_de_la_Galette_-_Google_Art_Project.jpg" "Renoir_-_Bal_du_moulin_de_la_Galette.jpg"
          get bruegel "Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter)_-_Google_Art_Project.jpg" "Pieter_Bruegel_d._Ä._106.jpg" "Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter).jpg"
          cat drop/sources.txt; ls -la drop; file drop/*
      - name: Commit the drop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drop
          git commit -m "sample scans drop [skip ci]"
          git push
