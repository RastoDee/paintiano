name: fetch-samples
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public-domain painting scans from Wikimedia Commons
        run: |
          mkdir -p drop
          UA="PaintianoSampleFetch/1.0 (https://paintiano.app; one-off fetch of public-domain scans)"
          get(){ out=$1; shift; for n in "$@"; do
              rm -f "drop/$out.jpg"
              curl -sSL --retry 3 -A "$UA" -o "drop/$out.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/$n?width=1920" || true
              if file "drop/$out.jpg" | grep -q "JPEG"; then echo "$out <- https://commons.wikimedia.org/wiki/File:$n" >> drop/sources.txt; return 0; fi
              sleep 2
            done; rm -f "drop/$out.jpg"; echo "FAIL $out" >> drop/sources.txt; }
          get monalisa "Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg" "Leonardo_da_Vinci_-_Mona_Lisa_(Louvre,_Paris).jpg"
          get wanderer "Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg" "Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg"
          cat drop/sources.txt; ls -la drop; file drop/*
      - name: Commit the drop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drop
          git commit -m "sample scans drop [skip ci]"
          git push
