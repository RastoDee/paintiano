name: fetch-samples
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public-domain painting scans from Wikimedia Commons
        run: |
          mkdir -p drop
          UA="PaintianoSampleFetch/1.0 (https://paintiano.app; one-off fetch of public-domain scans)"
          get(){ out=$1; shift; for n in "$@"; do
              rm -f "drop/$out.jpg"
              curl -sSL --retry 3 -A "$UA" -o "drop/$out.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/$n?width=1920" || true
              if file "drop/$out.jpg" | grep -q "JPEG"; then echo "$out <- https://commons.wikimedia.org/wiki/File:$n" >> drop/sources.txt; return 0; fi
              sleep 2
            done; rm -f "drop/$out.jpg"; echo "FAIL $out" >> drop/sources.txt; }
          get rousseau "Henri_Rousseau_-_The_Sleeping_Gypsy_-_Google_Art_Project.jpg" "Henri_Rousseau_010.jpg" "La_Bohémienne_endormie.jpg" "Henri_Rousseau_-_La_Bohémienne_endormie.jpg"
          get marcblue "Franz_Marc_-_Blaues_Pferd_I_-_Google_Art_Project.jpg" "Franz_Marc_Blaues_Pferd_I.jpg" "Franz_Marc_-_Blue_Horse_I.jpg"
          get marclarge "Franz_Marc-The_Large_Blue_Horses-1911.jpg" "Franz_Marc_-_The_Large_Blue_Horses_-_Google_Art_Project.jpg" "Franz_Marc_-_Die_großen_blauen_Pferde.jpg" "Franz_Marc_Large_Blue_Horses.jpg"
          cat drop/sources.txt; ls -la drop; file drop/*
      - name: Commit the drop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drop
          git commit -m "sample scans drop [skip ci]"
          git push
