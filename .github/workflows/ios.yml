# Builds the iOS app (Capacitor shell around the web app) on a cloud Mac.
#   • every push to the `ios` branch: a build for the simulator — proves the project compiles, needs no secrets
#   • "Run workflow" with upload=true: a signed build uploaded to TestFlight (needs the App Store Connect secrets)
name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The App Store page's texts (ios/fastlane/metadata) → App Store Connect. Only on a commit marked [metadata].
  # Nothing is submitted for review here: the texts land in the version that is being prepared.
  store_texts:
    if: ${{ contains(github.event.head_commit.message, '[metadata]') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Upload the texts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/asc.json"
          ruby -rjson -e 'File.write(ARGV[0], {key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: ENV["ASC_KEY_P8"], in_house: false}.to_json)' "$KEY"
          cd ios
          fastlane deliver --api_key_path "$KEY" --app_identifier app.paintiano --app_version 1.0 \
            --metadata_path fastlane/metadata --skip_binary_upload true --skip_screenshots true \
            --force true --run_precheck_before_submit false --submit_for_review false 2>&1 | tail -60
          rm -f "$KEY"

  asc:
    if: ${{ contains(github.event.head_commit.message, '[asc]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: App Store Connect housekeeping
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          pip install --quiet pyjwt cryptography
          if echo "$MSG" | grep -q "\[asc-pass\]"; then python3 ios/asc/asc_pass.py; else python3 ios/asc/asc.py; fi

  store_shots:
    if: ${{ contains(github.event.head_commit.message, '[screens]') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload the screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/asc.json"
          ruby -rjson -e 'File.write(ARGV[0], {key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: ENV["ASC_KEY_P8"], in_house: false}.to_json)' "$KEY"
          cd ios
          fastlane deliver --api_key_path "$KEY" --app_identifier app.paintiano --app_version 1.0 \
            --screenshots_path fastlane/screenshots --skip_binary_upload true --skip_metadata true \
            --overwrite_screenshots true --force true --run_precheck_before_submit false --submit_for_review false 2>&1 | tail -80
          rm -f "$KEY"

  build:
    if: ${{ !contains(github.event.head_commit.message, '[metadata]') && !contains(github.event.head_commit.message, '[screens]') && !contains(github.event.head_commit.message, '[asc]') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Web build
        env:
          PF_IOS_DEBUG: ${{ contains(github.event.head_commit.message, '[simshot]') && '1' || '0' }}
        run: |
          npm ci
          npm run build
          node scripts/ios-web.mjs
          npx cap sync ios
      - name: Run in the simulator and take screenshots (diagnostics)
        if: ${{ contains(github.event.head_commit.message, '[simshot]') }}
        run: |
          set -uo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -5
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'App.app' -maxdepth 3 | head -1)
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "app=$APP sim=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b | tail -2
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.paintiano
          mkdir -p "$RUNNER_TEMP/shots"
          for t in 12 25 45; do sleep $([ $t = 12 ] && echo 12 || [ $t = 25 ] && echo 13 || echo 20); xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/s$t.png"; done
          ls -la "$RUNNER_TEMP/shots"
          for t in 12 45; do
            sips -Z 1400 -s format jpeg -s formatOptions 45 "$RUNNER_TEMP/shots/s$t.png" --out "$RUNNER_TEMP/shots/s$t.jpg" >/dev/null
            echo "B64START s$t"; base64 -i "$RUNNER_TEMP/shots/s$t.jpg" | fold -w 20000; echo "B64END s$t"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ contains(github.event.head_commit.message, '[simshot]') }}
        with:
          name: simshots
          path: ${{ runner.temp }}/shots
      - name: Build for the simulator (no signing)
        if: ${{ !inputs.upload && !contains(github.event.head_commit.message, '[testflight]') && !contains(github.event.head_commit.message, '[simshot]') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload || contains(github.event.head_commit.message, '[testflight]') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: 6BU276UUXB
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "The App Store Connect secrets are missing (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -40
          # The archive is made unsigned (signing it would need a development profile, and that needs a
          # registered device). The export signs it for the App Store with a cloud-managed certificate.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          rm -f "$KEY"
