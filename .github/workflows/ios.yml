# Builds the iOS app (Capacitor shell around the web app) on a cloud Mac.
#   • every push to the `ios` branch: a build for the simulator — proves the project compiles, needs no secrets
#   • "Run workflow" with upload=true: a signed build uploaded to TestFlight (needs the App Store Connect secrets)
name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Web build
        run: |
          npm ci
          npm run build
          node scripts/ios-web.mjs
          npx cap sync ios
      - name: Build for the simulator (no signing)
        if: ${{ !inputs.upload && !contains(github.event.head_commit.message, '[testflight]') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload || contains(github.event.head_commit.message, '[testflight]') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: 6BU276UUXB
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "The App Store Connect secrets are missing (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -40
          # The archive is made unsigned (signing it would need a development profile, and that needs a
          # registered device). The export signs it for the App Store with a cloud-managed certificate.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          rm -f "$KEY"
