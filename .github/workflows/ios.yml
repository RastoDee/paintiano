# Builds the iOS app (Capacitor shell around the web app) on a cloud Mac.
#   • every push to the `ios` branch: a build for the simulator — proves the project compiles, needs no secrets
#   • "Run workflow" with upload=true: a signed build uploaded to TestFlight (needs the App Store Connect secrets)
name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight'
        type: boolean
        default: false
      beta:
        description: 'Upload as Paintiano Beta (app.paintiano.beta) — the test app beside the App Store one'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The App Store page's texts (ios/fastlane/metadata) → App Store Connect. Only on a commit marked [metadata].
  # Nothing is submitted for review here: the texts land in the version that is being prepared.
  store_texts:
    if: ${{ contains(github.event.head_commit.message, '[metadata]') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Upload the texts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/asc.json"
          ruby -rjson -e 'File.write(ARGV[0], {key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: ENV["ASC_KEY_P8"], in_house: false}.to_json)' "$KEY"
          cd ios
          fastlane deliver --api_key_path "$KEY" --app_identifier app.paintiano --app_version 1.2 \
            --metadata_path fastlane/metadata --skip_binary_upload true --skip_screenshots true \
            --force true --run_precheck_before_submit false --submit_for_review false 2>&1 | tail -60
          rm -f "$KEY"

  asc:
    if: ${{ contains(github.event.head_commit.message, '[asc]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: App Store Connect housekeeping
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          pip install --quiet pyjwt cryptography
          if echo "$MSG" | grep -q "\[asc-notices-fix\]"; then python3 ios/asc/asc_notices_fix.py; elif echo "$MSG" | grep -q "\[asc-notices\]"; then python3 ios/asc/asc_notices.py; elif echo "$MSG" | grep -q "\[asc-video-state\]"; then python3 ios/asc/asc_video_state.py; elif echo "$MSG" | grep -q "\[asc-search\]"; then python3 ios/asc/asc_search.py; elif echo "$MSG" | grep -q "\[asc-refdata\]"; then python3 ios/asc/asc_refdata.py; elif echo "$MSG" | grep -q "\[asc-header-video\]"; then python3 ios/asc/asc_header_video.py; elif echo "$MSG" | grep -q "\[asc-header\]"; then python3 ios/asc/asc_header.py; elif echo "$MSG" | grep -q "\[asc-cancel\]"; then python3 ios/asc/asc_cancel.py; elif echo "$MSG" | grep -q "\[asc-submit12\]"; then python3 ios/asc/asc_submit12.py; elif echo "$MSG" | grep -q "\[asc-submit11\]"; then python3 ios/asc/asc_submit11.py; elif echo "$MSG" | grep -q "\[asc-v11-attach\]"; then PF_ATTACH=1 python3 ios/asc/asc_v11.py; elif echo "$MSG" | grep -q "\[asc-v12-attach\]"; then PF_ATTACH=1 python3 ios/asc/asc_v12.py; elif echo "$MSG" | grep -q "\[asc-promo\]"; then python3 ios/asc/asc_promo.py; elif echo "$MSG" | grep -q "\[asc-v12\]"; then python3 ios/asc/asc_v12.py; elif echo "$MSG" | grep -q "\[asc-v11\]"; then python3 ios/asc/asc_v11.py; elif echo "$MSG" | grep -q "\[asc-beta\]"; then python3 ios/asc/asc_beta.py; elif echo "$MSG" | grep -q "\[asc-where\]"; then python3 ios/asc/asc_where.py; elif echo "$MSG" | grep -q "\[asc-release\]"; then python3 ios/asc/asc_release.py; elif echo "$MSG" | grep -q "\[asc-submit\]"; then python3 ios/asc/asc_submit.py; elif echo "$MSG" | grep -q "\[asc-swap\]"; then python3 ios/asc/asc_swap.py; elif echo "$MSG" | grep -q "\[asc-iap\]"; then python3 ios/asc/asc_iapsubmit.py; elif echo "$MSG" | grep -q "\[asc-final\]"; then python3 ios/asc/asc_final.py; elif echo "$MSG" | grep -q "\[asc-fill\]"; then python3 ios/asc/asc_fill.py; elif echo "$MSG" | grep -q "\[asc-check\]"; then python3 ios/asc/asc_check.py; elif echo "$MSG" | grep -q "\[asc-pass\]"; then python3 ios/asc/asc_pass.py; else python3 ios/asc/asc.py; fi

  store_shots:
    if: ${{ contains(github.event.head_commit.message, '[screens]') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload the screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/asc.json"
          ruby -rjson -e 'File.write(ARGV[0], {key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: ENV["ASC_KEY_P8"], in_house: false}.to_json)' "$KEY"
          cd ios
          fastlane deliver --api_key_path "$KEY" --app_identifier app.paintiano --app_version 1.2 \
            --screenshots_path fastlane/screenshots --skip_binary_upload true --skip_metadata true \
            --overwrite_screenshots true --force true --run_precheck_before_submit false --submit_for_review false 2>&1 | tail -80
          rm -f "$KEY"

  build:
    if: ${{ !contains(github.event.head_commit.message, '[metadata]') && !contains(github.event.head_commit.message, '[screens]') && !contains(github.event.head_commit.message, '[asc]') }}
    # Xcode 27 / the iOS 27 SDK: App Store Connect requires it for uploads from April 2027 (ITMS-90725); macos-latest still has Xcode 26
    # the simulator diagnostics ([simshot] / [simtest]) run on macos-latest: the xcode-27 image has no iOS simulator runtime
    runs-on: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[simshot]') || contains(github.event.head_commit.message, '[simtest]'))) && 'macos-latest' || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Web build
        env:
          PF_IOS_DEBUG: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[simshot]') || contains(github.event.head_commit.message, '[simtest]')) && '1' || '0' }}
          PF_IOS_SELFTEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[simtest]') && '1' || '0' }}
        run: |
          npm ci
          npm run build
          node scripts/ios-web.mjs
          npx cap sync ios
      - name: Run in the simulator and take screenshots (diagnostics)
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[simshot]') || contains(github.event.head_commit.message, '[simtest]')) }}
        timeout-minutes: 25
        env:
          SIMTEST: ${{ contains(github.event.head_commit.message, '[simtest]') && '1' || '0' }}
        run: |
          set -uo pipefail
          to(){ perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no timeout(1): every simulator call gets a time limit
          echo "$(date -u +%T) runtimes:"; xcrun simctl list runtimes | tail -6
          to 1200 xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -5
          echo "$(date -u +%T) built"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'App.app' -maxdepth 3 | head -1)
          # an iPhone on the newest iOS runtime that is actually installed
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,re; d=json.load(sys.stdin)['devices']; ks=sorted([(tuple(int(n) for n in m.groups()),k) for k in d for m in [re.search(r'SimRuntime\.iOS-(\d+)-(\d+)$',k)] if m]); print(next((x['udid'] for _,k in reversed(ks) for x in d[k] if x['name'].startswith('iPhone') and x.get('isAvailable', True)), ''))")
          [ -n "$UDID" ] || { echo "no iPhone simulator on this runner"; exit 1; }
          echo "app=$APP sim=$UDID"
          set +e   # from here a slow simulator call must not end the diagnostics
          to 240 xcrun simctl boot "$UDID" || true
          to 300 xcrun simctl bootstatus "$UDID" -b | tail -2; echo "$(date -u +%T) booted"
          to 180 xcrun simctl install "$UDID" "$APP"; echo "$(date -u +%T) installed"
          to 90 xcrun simctl launch "$UDID" app.paintiano; echo "$(date -u +%T) launched"
          mkdir -p "$RUNNER_TEMP/shots"
          if [ "$SIMTEST" = 1 ]; then
            end=$((SECONDS+660)); k=0
            while [ $SECONDS -lt $end ]; do k=$((k+1)); n=$(printf %02d $k); to 45 xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/t$n.png" >/dev/null 2>&1 || echo "shot $n: $?"; echo "$(date -u +%T) shot $n"; done
            for f in "$RUNNER_TEMP"/shots/t*.png; do [ -f "$f" ] || continue; j="${f%.png}.jpg"; sips -Z 640 -s format jpeg -s formatOptions 50 "$f" --out "$j" >/dev/null && rm -f "$f"; echo "B64START $(basename "$j")"; base64 -i "$j" | fold -w 20000; echo "B64END"; done || true
            to 90 xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "App"' --style compact 2>/dev/null | grep -iE "error|crash|exception|jetsam|WebContent" | tail -40 || true
          fi
          for t in 12 25 45; do [ "$SIMTEST" = 1 ] && break; sleep $([ $t = 12 ] && echo 12 || [ $t = 25 ] && echo 13 || echo 20); xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/s$t.png"; done
          ls -la "$RUNNER_TEMP/shots"
          for t in 12 45; do
            [ -f "$RUNNER_TEMP/shots/s$t.png" ] || continue
            sips -Z 1400 -s format jpeg -s formatOptions 45 "$RUNNER_TEMP/shots/s$t.png" --out "$RUNNER_TEMP/shots/s$t.jpg" >/dev/null
            echo "B64START s$t"; base64 -i "$RUNNER_TEMP/shots/s$t.jpg" | fold -w 20000; echo "B64END s$t"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[simshot]') || contains(github.event.head_commit.message, '[simtest]')) }}
        with:
          name: simshots
          path: ${{ runner.temp }}/shots
      - name: Build for the simulator (no signing)
        if: ${{ !inputs.upload && !contains(github.event.head_commit.message, '[testflight]') && !contains(github.event.head_commit.message, '[simshot]') && !contains(github.event.head_commit.message, '[simtest]') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload || contains(github.event.head_commit.message, '[testflight]') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: 6BU276UUXB
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "The App Store Connect secrets are missing (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          # Paintiano Beta: the same app under its own identifier and name — it installs beside the App Store version
          BID=(); if [ "${{ inputs.beta }}" = "true" ]; then
            BID=(PRODUCT_BUNDLE_IDENTIFIER=app.paintiano.beta)
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Paintiano β" ios/App/App/Info.plist
          fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" ${BID[@]+"${BID[@]}"} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -40
          # The archive is made unsigned (signing it would need a development profile, and that needs a
          # registered device). The export signs it for the App Store with a cloud-managed certificate.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          rm -f "$KEY"
