<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paintiano · Basic Pitch test</title>
<style>
  body{margin:0;background:#06060c;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px 16px calc(40px + env(safe-area-inset-bottom));max-width:520px;margin-inline:auto;}
  h1{font-size:13px;letter-spacing:.25em;color:#c9a84c;text-align:center;font-weight:600;margin:6px 0 2px;}
  .sub{font-size:11px;color:#7a7a88;text-align:center;margin:0 0 22px;}
  .btn{display:block;width:100%;box-sizing:border-box;padding:14px 0;border-radius:26px;border:1px solid rgba(201,168,76,.45);background:transparent;color:#c9a84c;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin:10px 0;font-family:inherit;}
  .btn.primary{background:#c9a84c;color:#06060c;border-color:#c9a84c;}
  .btn:disabled{opacity:.35;}
  .card{background:#0d0d16;border:1px solid #22222e;border-radius:14px;padding:14px;margin:14px 0;}
  .stat{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #1a1a24;}
  .stat:last-child{border-bottom:none;}
  .stat b{color:#c9a84c;font-weight:600;}
  #status{font-size:12px;color:#b8b8c8;text-align:center;min-height:18px;margin:8px 0;}
  #bar{width:100%;height:4px;background:#1c1c26;border-radius:2px;overflow:hidden;margin:8px 0;display:none;}
  #barfill{height:100%;width:0%;background:#c9a84c;transition:width .2s;}
  canvas{width:100%;border-radius:10px;background:#0a0a12;display:block;}
  #notesList{font-size:11px;color:#9a9aa8;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.7;max-height:180px;overflow:auto;white-space:pre;}
  input[type=file]{display:none;}
  .filelbl{display:block;text-align:center;font-size:11px;color:#7a7a88;text-decoration:underline;cursor:pointer;margin:2px 0 14px;}
  #recDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e24b4a;margin-right:8px;vertical-align:1px;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}
</style>
</head>
<body>
<h1>P A I N T I A N O</h1>
<p class="sub">Basic Pitch PoC · verný prepis · test v6</p>
<p class="sub" id="diagUrl" style="word-break:break-all"></p>

<button class="btn primary" id="recBtn">● nahraj 20 s z reproduktora</button>
<label class="filelbl" for="fileInp">alebo vyber audio súbor (mp3 / wav / m4a)</label>
<input type="file" id="fileInp" accept="audio/*">

<div id="status"></div>
<div id="bar"><div id="barfill"></div></div>

<div class="card" id="statsCard" style="display:none">
  <div class="stat"><span>počet nôt</span><b id="stNotes">–</b></div>
  <div class="stat"><span>dĺžka audia</span><b id="stDur">–</b></div>
  <div class="stat"><span>čas spracovania</span><b id="stTime">–</b></div>
  <div class="stat"><span>TF backend</span><b id="stBackend">–</b></div>
</div>

<div class="card" id="rollCard" style="display:none">
  <canvas id="roll" height="220"></canvas>
</div>

<button class="btn" id="playBtn" style="display:none">▶ prehraj prepísané noty</button>

<div class="card" id="listCard" style="display:none">
  <div id="notesList"></div>
</div>

<script src="/bp2/bp-bundle.js"></script>
<script>
(function(){
  document.getElementById('diagUrl').textContent=location.href;
  window.addEventListener('error',function(e){var s=document.getElementById('status');if(s)s.textContent='JS chyba: '+(e.message||e.type);});
  window.addEventListener('unhandledrejection',function(e){var s=document.getElementById('status');if(s)s.textContent='chyba (async): '+(e.reason&&e.reason.message?e.reason.message:e.reason);});
  var recBtn=document.getElementById('recBtn'),fileInp=document.getElementById('fileInp'),
      statusEl=document.getElementById('status'),bar=document.getElementById('bar'),barfill=document.getElementById('barfill'),
      playBtn=document.getElementById('playBtn');
  var lastNotes=null,recording=false,recStop=null;

  function setStatus(t,rec){statusEl.innerHTML=(rec?'<span id="recDot"></span>':'')+t;}
  function fmt(x,d){return Number(x).toFixed(d===undefined?1:d);}

  // ── nahrávanie 20 s cez mikrofón ──
  recBtn.onclick=function(){
    if(recording){if(recStop)recStop();return;}
    try{if(navigator.audioSession)navigator.audioSession.type='play-and-record';}catch(_){}
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
      var AC=window.AudioContext||window.webkitAudioContext;
      var ac=new AC();
      try{ac.resume();}catch(_){}
      var src=ac.createMediaStreamSource(stream);
      var proc=ac.createScriptProcessor(4096,1,1);
      var chunks=[],total=0,MAX=ac.sampleRate*20;
      recording=true;recBtn.textContent='■ stop';
      var t0=Date.now();
      var tick=setInterval(function(){
        var left=Math.max(0,20-(Date.now()-t0)/1000);
        setStatus('nahrávam… '+fmt(left,0)+' s (pusti hudbu z reproduktora)',true);
        if(left<=0&&recStop)recStop();
      },250);
      proc.onaudioprocess=function(e){
        var d=e.inputBuffer.getChannelData(0);
        chunks.push(new Float32Array(d));total+=d.length;
        if(total>=MAX&&recStop)recStop();
      };
      src.connect(proc);proc.connect(ac.destination);
      recStop=function(){
        recStop=null;recording=false;clearInterval(tick);
        recBtn.textContent='● nahraj 20 s z reproduktora';
        try{proc.disconnect();src.disconnect();}catch(_){}
        stream.getTracks().forEach(function(t){t.stop();});
        var all=new Float32Array(total),o=0;
        chunks.forEach(function(c){all.set(c,o);o+=c.length;});
        ac.close();
        processAudio(all,ac.sampleRate);
      };
    }).catch(function(e){setStatus('mikrofón nedostupný: '+e.name);});
  };

  // ── súbor ──
  fileInp.onchange=function(){
    var f=fileInp.files[0];if(!f)return;
    setStatus('čítam súbor…');
    f.arrayBuffer().then(function(ab){
      var AC=window.AudioContext||window.webkitAudioContext;
      var ac=new AC();
      ac.decodeAudioData(ab,function(buf){
        var mono=buf.getChannelData(0);
        if(buf.numberOfChannels>1){
          var b=buf.getChannelData(1);mono=new Float32Array(buf.length);
          var a=buf.getChannelData(0);
          for(var i=0;i<buf.length;i++)mono[i]=(a[i]+b[i])/2;
        }
        ac.close();
        processAudio(mono,buf.sampleRate);
      },function(){setStatus('nepodarilo sa dekódovať súbor');});
    });
  };

  // ── resample na 22050 mono + Basic Pitch ──
  function processAudio(samples,sr){
    setStatus('prevzorkovávam…');
    var DUR=samples.length/sr;
    var off=new OfflineAudioContext(1,Math.ceil(DUR*22050),22050);
    var buf=off.createBuffer(1,samples.length,sr);
    buf.copyToChannel(samples,0);
    var s=off.createBufferSource();s.buffer=buf;s.connect(off.destination);s.start();
    off.startRendering().then(function(rend){
      run(rend.getChannelData(0),DUR);
    });
  }

  var bpModel=null;
  function run(audio22k,durS){
    bar.style.display='block';barfill.style.width='0%';
    var pre;
    if(bpModel){pre=Promise.resolve();}
    else{
      setStatus('kontrolujem model súbory…');
      var bust='?v='+Date.now();
      var mUrl='/bp2/model/model.json';
      var wUrl='/bp2/model/group1-shard1of1.bin';
      pre=fetch(mUrl+bust,{cache:'reload'}).then(function(r){
        if(!r.ok)throw new Error('model.json HTTP '+r.status+' · req: '+mUrl+' · resp: '+r.url);
        return fetch(wUrl+bust,{method:'HEAD',cache:'reload'});
      }).then(function(r){
        if(r&&!r.ok)throw new Error('weights .bin HTTP '+r.status+' · resp: '+r.url);
        setStatus('inicializujem TF ('+(BP.tf.getBackend()||'…')+')…');
        return BP.tf.ready();
      }).then(function(){
        setStatus('sťahujem model (~0.9 MB) · backend '+BP.tf.getBackend()+'…');
        bpModel=new BP.BasicPitch(BP.tf.loadGraphModel(mUrl+bust,{requestInit:{cache:'reload'}}));
        return bpModel.model;
      }).then(function(){setStatus('model načítaný · spúšťam prepis…');});
    }
    var frames=[],onsets=[],contours=[];
    var t0=performance.now();
    pre.then(function(){
    return bpModel.evaluateModel(audio22k,function(f,o,c){
      Array.prototype.push.apply(frames,f);
      Array.prototype.push.apply(onsets,o);
      Array.prototype.push.apply(contours,c);
    },function(p){
      barfill.style.width=Math.round(p*100)+'%';
      setStatus('prepisujem… '+Math.round(p*100)+' %');
    }).then(function(){
      var notes=BP.noteFramesToTime(BP.addPitchBendsToNoteEvents(contours,BP.outputToNotesPoly(frames,onsets,0.5,0.3,11)));
      var ms=performance.now()-t0;
      notes.sort(function(a,b){return a.startTimeSeconds-b.startTimeSeconds;});
      lastNotes=notes;
      bar.style.display='none';
      setStatus('hotovo ✦');
      document.getElementById('statsCard').style.display='block';
      document.getElementById('stNotes').textContent=notes.length;
      document.getElementById('stDur').textContent=fmt(durS)+' s';
      document.getElementById('stTime').textContent=fmt(ms/1000)+' s';
      document.getElementById('stBackend').textContent=BP.tf.getBackend();
      drawRoll(notes,durS);
      listNotes(notes);
      playBtn.style.display=notes.length?'block':'none';
    });
    }).catch(function(e){
      bar.style.display='none';
      setStatus('chyba: '+(e&&e.message?e.message:e));
    });
  }

  // ── piano roll ──
  function drawRoll(notes,durS){
    var card=document.getElementById('rollCard');card.style.display='block';
    var cv=document.getElementById('roll');
    var W=cv.clientWidth*(window.devicePixelRatio||1),H=220*(window.devicePixelRatio||1);
    cv.width=W;cv.height=H;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);
    if(!notes.length)return;
    var lo=127,hi=0;
    notes.forEach(function(n){if(n.pitchMidi<lo)lo=n.pitchMidi;if(n.pitchMidi>hi)hi=n.pitchMidi;});
    lo-=2;hi+=2;
    var COLORS=['#e24b4a','#ef9f27','#c9a84c','#97c459','#1d9e75','#5dcaa5','#378add','#7f77dd','#534ab7','#d4537e','#ed93b1','#d85a30'];
    notes.forEach(function(n){
      var x=n.startTimeSeconds/durS*W;
      var w=Math.max(2,n.durationSeconds/durS*W);
      var y=H-((n.pitchMidi-lo)/(hi-lo))*H;
      var h=Math.max(3,H/(hi-lo)*0.8);
      ctx.fillStyle=COLORS[((n.pitchMidi%12)+12)%12];
      ctx.globalAlpha=0.35+0.65*Math.min(1,n.amplitude);
      ctx.fillRect(x,y-h,w,h);
    });
    ctx.globalAlpha=1;
  }

  // ── zoznam ──
  var NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  function listNotes(notes){
    var card=document.getElementById('listCard');card.style.display='block';
    var out=notes.slice(0,40).map(function(n){
      var name=NAMES[((n.pitchMidi%12)+12)%12]+(Math.floor(n.pitchMidi/12)-1);
      return name.padEnd(4)+' '+fmt(n.startTimeSeconds,2)+'s  dur '+fmt(n.durationSeconds,2)+'s  amp '+fmt(n.amplitude,2);
    }).join('\n');
    if(notes.length>40)out+='\n… + '+(notes.length-40)+' ďalších';
    document.getElementById('notesList').textContent=out||'žiadne noty';
  }

  // ── prehratie prepísaných nôt ──
  playBtn.onclick=function(){
    if(!lastNotes||!lastNotes.length)return;
    var AC=window.AudioContext||window.webkitAudioContext;
    var ac=new AC();
    var master=ac.createGain();master.gain.value=0.5;master.connect(ac.destination);
    var t0=ac.currentTime+0.1;
    lastNotes.forEach(function(n){
      var osc=ac.createOscillator(),g=ac.createGain();
      osc.type='triangle';
      osc.frequency.value=440*Math.pow(2,(n.pitchMidi-69)/12);
      var st=t0+n.startTimeSeconds,en=st+Math.max(0.08,n.durationSeconds);
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.30*Math.min(1,n.amplitude+0.3),st+0.015);
      g.gain.setTargetAtTime(0,en-0.05,0.04);
      osc.connect(g);g.connect(master);
      osc.start(st);osc.stop(en+0.2);
    });
    var last=lastNotes[lastNotes.length-1];
    setStatus('prehrávam prepis…');
    setTimeout(function(){setStatus('hotovo ✦');try{ac.close();}catch(_){}},
      (last.startTimeSeconds+last.durationSeconds+0.5)*1000);
  };
})();
</script>
</body>
</html>
